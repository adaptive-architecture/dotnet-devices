name: Publish GitHub Pages.
on:
  release:
    types: [created]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Dotnet Setup
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    # The API reference restores the src/ projects. The key is its own, so this smaller
    # restore never takes the key the test job saves its full cache under.
    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-docs-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-docs
          ${{ runner.os }}-nuget

    - run: dotnet tool update -g docfx
    - run: docfx ./docfx/docfx.json

    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        # Upload entire repository ./docfx/.site
        path: './docfx/.site'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
