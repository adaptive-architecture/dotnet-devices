name: Build and test.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: "tests"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jre'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # In order for Sonar Scan to have all data.

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Install dependencies
        run: |
          dotnet restore

      - name: Verify format
        run: dotnet format --verify-no-changes

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner

      # samples/ is demonstration code. It is out of both lists: sonar.exclusions
      # keeps it out of the analysis, and sonar.coverage.exclusions keeps it out
      # of the coverage, so a sample never changes the quality gate.
      #
      # What is left on the coverage list is the thin layer that cannot run here and
      # holds no decision: the [LibraryImport] declarations, the adapters that do
      # nothing but forward to them, and the PDF path that calls the in-box Windows
      # engine. Everything above them is behind a seam (IWindowsSpoolerInterop,
      # IWindowsGdiInterop, IWindowsGdiImagePrinter) and runs on this Linux runner
      # against a fake spooler, so WindowsSpoolerDriver and WindowsGdiImagePrinter
      # are in the coverage and stay there. Excluded from coverage only, not from
      # analysis: Sonar still inspects every file for issues.
      # docs/windows-manual-tests.md lists what a person must still run on Windows.
      - name: SonarQube Begin
        run: >-
          dotnet sonarscanner begin /k:"adaptive-architecture_dotnet-devices"
          /o:"adaptive-architecture"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="./coverage/*coverage.opencover.*.xml"
          /d:sonar.scanner.scanAll=false
          /d:sonar.exclusions="**/assets/**/*,**/coverage/**/*,**/docfx/**/*,**/docs/**/*,**/samples/**/*,**/bin/**/*,**/obj/**/*"
          /d:sonar.coverage.exclusions="**/samples/**/*,**/Spooler/WindowsSpoolerInterop.cs,**/Spooler/WindowsGdiInterop.cs,**/Spooler/WindowsSpoolerInteropAdapter.cs,**/Spooler/WindowsGdiInteropAdapter.cs,**/Devices.Windows/WindowsPdfRenderer.cs,**/Devices.Windows/WindowsPdfConverter.cs"
          /d:sonar.scanner.skipJreProvisioning=true

      - name: Build
        run: dotnet build --no-incremental

      - name: Run Unit Tests
        run: sh ./pipeline/unit-test.sh

      # The rasterization scenarios write a page for every engine that ran. This runner has
      # no in-box Windows engine, so it renders the PDFium half; the windows job renders
      # both, and the job below puts the two archives together. Uploaded even when the tests
      # failed, because a wrong page is the thing these images exist to show.
      - name: Upload the rendered pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rasterization-linux
          path: artifacts/rasterization
          if-no-files-found: warn
          retention-days: 7

      - name: SonarQube End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # That the suite is platform-clean: it builds for a -windows target and no test carries a
  # Linux assumption. Its first run found three, one of them a crash in the mDNS browse on
  # any adapter without IPv6 configured.
  #
  # It also calls winspool.drv, through test/Devices.InteropTests, against a queue this job
  # creates and pauses. That is the one thing a fake cannot settle: it writes a structure
  # with the same declaration it reads it with, so a declaration wrong against the real
  # header still round-trips. Only bytes the spooler wrote can say.
  #
  # The queue is created rather than assumed. A runner with a stopped spooler or no printers
  # would let those tests pass while reaching no structure at all — EnumPrinters answers
  # nothing and the driver returns before it marshals anything. So provisioning is a step
  # that fails the job, it checks that the pause really took, and the tests skip themselves
  # unless DEVICES_TEST_QUEUE names a queue.
  #
  # The same tests run by hand on a developer's machine through pipeline/unit-test.sh;
  # docs/windows-manual-tests.md says how.
  #
  # No Sonar and no coverage here. The Linux job owns the report and the floor; a second
  # one would have to be merged into it for no gain, since these tests are the same tests.
  #
  # The integration tests are left out on purpose: they need Linux containers, and a
  # windows-latest runner has Docker in Windows-container mode.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental

      # The queue must be paused. A live one prints, and Microsoft Print To PDF stops on a
      # Save As dialog nothing can answer. Paused, every job stays in the queue where a test
      # reads it back, which is the whole point.
      #
      # There is no Suspend-PrintQueue cmdlet. Pausing a queue is a method on Win32_Printer.
      - name: Provision a paused print queue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'adaptarch-ci'

          Set-Service -Name Spooler -StartupType Automatic
          Start-Service -Name Spooler

          $preferred = @('Microsoft Print To PDF', 'Generic / Text Only', 'Microsoft XPS Document Writer v4')
          $drivers = Get-PrinterDriver
          $drivers | Format-Table Name
          $driver = $drivers | Where-Object { $preferred -contains $_.Name } | Select-Object -First 1
          if (-not $driver) { $driver = $drivers | Select-Object -First 1 }
          if (-not $driver) { throw 'No printer driver is installed on this runner.' }

          Add-Printer -Name $name -DriverName $driver.Name -PortName 'PORTPROMPT:'
          Get-CimInstance Win32_Printer -Filter "Name='$name'" | Invoke-CimMethod -MethodName Pause | Out-Null

          # Fail here rather than let the tests refuse one at a time. A queue that did not
          # pause would print, and on Print To PDF it would wait on a dialog forever.
          $printer = Get-CimInstance Win32_Printer -Filter "Name='$name'"
          if (-not $printer) { throw "The queue '$name' was not created." }
          # PRINTER_STATUS_PAUSED is bit 0 of PrinterState. Parenthesised because -not
          # binds tighter than -band, which would test the wrong thing entirely.
          if (($printer.PrinterState -band 1) -ne 1) { throw "The queue '$name' did not pause; PrinterState is $($printer.PrinterState)." }
          Get-Printer -Name $name | Format-List Name, DriverName, PortName, PrinterStatus

          "DEVICES_TEST_QUEUE=$name" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # bash, not the pwsh default: PowerShell does not stop a script on a native command
      # that failed, and the step takes the exit code of the last one. A failing project
      # followed by a passing one reported the job green.
      - name: Run tests that do not need a container
        shell: bash
        run: |
          dotnet test test/Devices.UnitTests/Devices.UnitTests.csproj --no-build
          dotnet test test/Devices.DependencyInjection.UnitTests/Devices.DependencyInjection.UnitTests.csproj --no-build
          dotnet test test/Devices.Pdfium.UnitTests/Devices.Pdfium.UnitTests.csproj --no-build
          dotnet test test/Devices.Windows.UnitTests/Devices.Windows.UnitTests.csproj --no-build
          dotnet test test/Devices.InteropTests/Devices.InteropTests.csproj --no-build

      # This runner has both engines, so its archive is the one that compares them: its
      # index.html shows PDFium and the in-box engine side by side with no gaps.
      - name: Upload the rendered pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rasterization-windows
          path: artifacts/rasterization
          if-no-files-found: warn
          retention-days: 7

  # One archive holding both runs, so the two engines can be compared without downloading
  # twice. It checks nothing out: the workspace holds only what the two jobs produced, which
  # is what keeps the paths inside the archive predictable.
  #
  # Each half is downloaded under a name of its own, and the upload takes their parent, so
  # the least-common-ancestor rule puts artifacts/rasterization-linux and
  # artifacts/rasterization-windows at the root of the zip.
  rasterization:
    runs-on: ubuntu-latest
    needs: [test, windows]
    if: always()

    steps:
      # continue-on-error: a job that failed before it rendered anything uploaded no
      # archive, and half the pages is still worth having. The page reports the half that
      # is missing by itself.
      - name: Download the Linux pages
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: rasterization-linux
          path: combined/artifacts/rasterization-linux

      - name: Download the Windows pages
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: rasterization-windows
          path: combined/artifacts/rasterization-windows

      # Each half carries its own index.html, and neither knows the other was downloaded
      # beside it. This one says which to open for what.
      - name: Write the front page
        run: |
          # Both downloads may have failed, in which case nothing created the folder.
          mkdir -p combined/artifacts
          cat > combined/artifacts/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Rasterized pages</title>
          <style>
            :root { color-scheme: light dark; }
            body { font: 16px/1.6 system-ui, sans-serif; width: min(80%, 1600px); margin: 0 auto; padding: 24px 16px; }
            p, li { max-width: 90ch; }
          </style>
          </head>
          <body>
          <h1>Rasterized pages</h1>
          <p>The PDF rasterization scenarios, rendered by every engine available on each runner
          and decoded back out of the PWG Raster each one produced. Nothing here was printed.</p>
          <ul>
            <li><a href="rasterization-windows/index.html">From the Windows runner</a> — both
            engines, so this is the one that compares them.</li>
            <li><a href="rasterization-linux/index.html">From the Linux runner</a> — PDFium only.
            The in-box engine ships with Windows, so it renders nothing here and its tiles say so.</li>
          </ul>
          <p>The two engines agree about the page size: the units each measures it in cancel, and
          both render A4 at 1240 by 1755 for 150 dots an inch. The fixture embeds its font rather
          than naming one, so they draw the same glyphs too, and what is left between them is their
          rasterizers. Each engine is asserted against itself, and these pages are where the two are
          compared by eye.</p>
          </body>
          </html>
          HTML

      - name: Upload both runs as one archive
        uses: actions/upload-artifact@v7
        with:
          name: rasterization
          path: combined
          if-no-files-found: warn
          retention-days: 30
