name: Build and test.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: "tests"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jre'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # In order for Sonar Scan to have all data.

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Install dependencies
        run: |
          dotnet restore

      - name: Verify format
        run: dotnet format --verify-no-changes

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner

      # samples/ is demonstration code. It is out of both lists: sonar.exclusions
      # keeps it out of the analysis, and sonar.coverage.exclusions keeps it out
      # of the coverage, so a sample never changes the quality gate.
      #
      # What is left on the coverage list is the thin layer that cannot run here and
      # holds no decision: the [LibraryImport] declarations, the adapters that do
      # nothing but forward to them, and the PDF path that calls the in-box Windows
      # engine. Everything above them is behind a seam (IWindowsSpoolerInterop,
      # IWindowsGdiInterop, IWindowsGdiImagePrinter) and runs on this Linux runner
      # against a fake spooler, so WindowsSpoolerDriver and WindowsGdiImagePrinter
      # are in the coverage and stay there. Excluded from coverage only, not from
      # analysis: Sonar still inspects every file for issues.
      # docs/windows-manual-tests.md lists what a person must still run on Windows.
      - name: SonarQube Begin
        run: >-
          dotnet sonarscanner begin /k:"adaptive-architecture_dotnet-devices"
          /o:"adaptive-architecture"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="./coverage/coverage.opencover.*.xml"
          /d:sonar.scanner.scanAll=false
          /d:sonar.exclusions="**/assets/**/*,**/coverage/**/*,**/docfx/**/*,**/docs/**/*,**/samples/**/*,**/bin/**/*,**/obj/**/*"
          /d:sonar.coverage.exclusions="**/samples/**/*,**/Spooler/WindowsSpoolerInterop.cs,**/Spooler/WindowsGdiInterop.cs,**/Spooler/WindowsSpoolerInteropAdapter.cs,**/Spooler/WindowsGdiInteropAdapter.cs,**/Devices.Windows/WindowsPdfRenderer.cs,**/Devices.Windows/WindowsPdfConverter.cs"
          /d:sonar.scanner.skipJreProvisioning=true

      - name: Build
        run: dotnet build --no-incremental

      - name: Run Unit Tests
        run: sh ./pipeline/unit-test.sh

      - name: SonarQube End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Two things. That the suite is platform-clean — its first run found three Linux
  # assumptions, one of them a crash in the mDNS browse on any adapter without IPv6 — and
  # that the interop declarations are right, which is the part no fake can settle: a
  # structure declared wrongly against the real header still round-trips through a fake,
  # because the fake writes it with the same declaration it reads it with.
  #
  # The queue is created here rather than assumed. A runner with a stopped spooler, or one
  # with no printers, would let a test pass while reaching no structure at all: EnumPrinters
  # answers nothing and the driver returns before it ever marshals. Provisioning is
  # therefore a step that must fail the job, and the tests skip themselves when
  # DEVICES_TEST_QUEUE is unset so that they never quietly prove nothing.
  #
  # No Sonar and no coverage here. The Linux job owns the report and the floor; a second
  # one would have to be merged into it for no gain, since these tests are the same tests.
  #
  # The integration tests are left out on purpose: they need Linux containers, and a
  # windows-latest runner has Docker in Windows-container mode.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-incremental

      # The queue is paused, so every job sent to it stays in it where a test can read it
      # back, and nothing ever prints. PORTPROMPT: is the port that asks where to write,
      # which a paused queue never gets to do.
      - name: Provision a paused print queue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Service -Name Spooler -StartupType Automatic
          Start-Service -Name Spooler
          Get-PrinterDriver | Format-Table Name

          $driver = Get-PrinterDriver |
            Where-Object { $_.Name -in @('Microsoft Print To PDF', 'Generic / Text Only', 'Microsoft XPS Document Writer v4') } |
            Select-Object -First 1
          if (-not $driver) { $driver = Get-PrinterDriver | Select-Object -First 1 }
          if (-not $driver) { throw 'No printer driver is installed on this runner.' }

          Add-Printer -Name 'adaptarch-ci' -DriverName $driver.Name -PortName 'PORTPROMPT:'
          Suspend-PrintQueue -Name 'adaptarch-ci'
          Get-Printer -Name 'adaptarch-ci' | Format-List Name, DriverName, PortName, PrinterStatus

          "DEVICES_TEST_QUEUE=adaptarch-ci" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # bash, not the pwsh default: PowerShell does not stop a script on a native command
      # that failed, and the step takes the exit code of the last one. A failing project
      # followed by a passing one reported the job green.
      - name: Run tests that do not need a container
        shell: bash
        run: |
          dotnet test test/Devices.UnitTests/Devices.UnitTests.csproj --no-build
          dotnet test test/Devices.DependencyInjection.UnitTests/Devices.DependencyInjection.UnitTests.csproj --no-build
          dotnet test test/Devices.Windows.UnitTests/Devices.Windows.UnitTests.csproj --no-build
          dotnet test test/Devices.InteropTests/Devices.InteropTests.csproj --no-build
